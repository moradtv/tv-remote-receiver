<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة استقبال الأوامر - TV Receiver</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 15vh;
            margin: 0;
        }
        h1 {
            font-size: 2.5rem;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.5rem;
            color: #b0b0b0;
        }
        .status-box {
            background: #1e1e1e;
            display: inline-block;
            padding: 30px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid #333;
        }
    </style>
</head>
<body>

    <div class="status-box">
        <h1>🟢 شاشة سامسونج متصلة</h1>
        <p id="command-display">في انتظار الأوامر من تطبيق الهاتف...</p>
    </div>

    <!-- استيراد مكتبات Firebase وربطها بالمفاتيح الحقيقية -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
          apiKey: "AIzaSyDqaxEVofAo4hpusSoEs_I7WjDBYhTsmmE",
          authDomain: "tvremotecontrol-79e6d.firebaseapp.com",
          databaseURL: "https://tvremotecontrol-79e6d-default-rtdb.firebaseio.com",
          projectId: "tvremotecontrol-79e6d",
          storageBucket: "tvremotecontrol-79e6d.firebasestorage.app",
          messagingSenderId: "290790846314",
          appId: "1:290790846314:web:b8567e16119030a0c27f13",
          measurementId: "G-54NFVM8CXV"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // مراقبة الأوامر القادمة بصفة ثابتة بدون أي توجيه تلقائي لليوتيوب
        const commandRef = ref(db, 'tv_command');
        onValue(commandRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                console.log("تم استلام أمر:", data);
                document.getElementById('command-display').innerText = "آخر أمر تم استقباله: " + (data.action || data);
            }
        });
    </script>

</body>
</html>
