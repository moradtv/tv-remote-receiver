<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شاشة مستقبل الأوامر</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 100px; }
        h1 { font-size: 35px; color: #4CAF50; }
        #last-cmd { color: #ffeb3b; font-size: 28px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>📺 شاشة سامسونج متصلة بـ Firebase</h1>
    <p>في انتظار الأوامر من تطبيق الهاتف...</p>
    <div id="last-cmd">آخر أمر: لا توجد أوامر بعد</div>

    <script>
        // إعدادات Firebase الخاصة بالمشروع ديالي
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // الاستماع فقط للأوامر دون أي توجيه لليوتيوب
        db.ref('tv_commands/latest_command').on('value', (snapshot) => {
            const command = snapshot.val();
            if (command) {
                document.getElementById('last-cmd').innerText = "آخر أمر: " + command;
            }
        });
    </script>
</body>
</html>
